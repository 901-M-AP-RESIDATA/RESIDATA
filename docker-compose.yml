services:
  db:
    image: postgres:16-alpine
    container_name: residata_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: hola123
      POSTGRES_DB: residata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/01_esquema.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
      - ./database/02_datos_iniciales.sql:/docker-entrypoint-initdb.d/02_datos_iniciales.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d residata"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7-jammy
    container_name: residata_mongo
    restart: always
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: mongopassword123
      MONGO_INITDB_DATABASE: residata_telemetria
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: residata_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+psycopg://postgres:hola123@db:5432/residata
      - MONGO_URL=mongodb://admin:mongopassword123@mongo:27017/residata_telemetria?authSource=admin
      - APP_NOMBRE=ResiData API
      - APP_VERSION=1.0.0
      - ENTORNO=produccion
      - DEBUG=false
      - JWT_SECRETO=cambiar-este-secreto-por-uno-aleatorio-de-48-bytes
      - JWT_ALGORITMO=HS256
      - ACCESS_TOKEN_MINUTOS=30
      - REFRESH_TOKEN_DIAS=7
      - CORS_ORIGENES=http://localhost,http://localhost:80,http://localhost:8080,http://localhost:5173,http://localhost:3000,http://127.0.0.1,http://127.0.0.1:80,http://127.0.0.1:8080,http://127.0.0.1:5173,http://127.0.0.1:3000,http://150.136.142.202,http://150.136.142.202:80,http://150.136.142.202:8080
      - RUTA_MODELO=app/ml/pesos/residuos_yolo.pt
      - UMBRAL_CONFIANZA=0.60
      - CATEGORIA_BAJA_CONFIANZA=Peligroso
      - TIEMPO_MAX_INFERENCIA_MS=2000
      - TAMANO_MAX_IMAGEN_MB=5
      - DIRECTORIO_ALMACENAMIENTO=storage/imagenes
      - ADMIN_NOMBRE=Administrador ResiData
      - ADMIN_CORREO=admin@residata.local
      - ADMIN_CONTRASENA=Cambiar123!
      - LOG_NIVEL=INFO
      - LOG_FORMATO=consola
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage/imagenes

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=
        - VITE_USAR_MOCK=false
        - VITE_SONIDO_ALERTAS=true
    container_name: residata_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
      - "8080:80"
      - "5173:80"
      - "3000:80"

volumes:
  postgres_data:
  mongo_data:
  backend_storage:
